<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leitor — BIFFI.ONLINE</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --rosa: #F2E6D3; --rosa-med: #D9BC8E; --roxo: #7A4A2D;
      --roxo-esc: #3D2817; --dourado: #C9A227; --branco: #fff;
    }

    html, body {
      height: 100%;
      font-family: 'Georgia', serif;
      background: linear-gradient(160deg, #2A1A0F 0%, #4A2E1A 55%, #2A1A0F 100%);
      color: #fff;
      overflow: hidden;
      /* Deterrentes básicos contra cópia — nada disso bloqueia print de tela,
         só dificulta o caminho mais fácil (selecionar/arrastar/inspecionar). */
      -webkit-user-select: none; -moz-user-select: none; user-select: none;
      -webkit-touch-callout: none;
    }

    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px;
      background: rgba(0,0,0,0.35);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .logo { font-size: 18px; font-weight: 900; letter-spacing: 2px; color: var(--dourado); text-decoration: none; }
    .voltar { font-family: Arial, sans-serif; font-size: 12.5px; font-weight: 700; color: #fff; text-decoration: none; opacity: 0.85; }
    .voltar:hover { opacity: 1; }
    .titulo-livro { font-family: Arial, sans-serif; font-size: 13px; opacity: 0.8; }

    .palco {
      position: fixed;
      top: 60px; bottom: 70px; left: 0; right: 0;
      display: flex; align-items: center; justify-content: center;
    }

    #livro { touch-action: none; }

    .controles {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
      display: flex; align-items: center; justify-content: center; gap: 22px;
      padding: 14px; background: rgba(0,0,0,0.35); backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255,255,255,0.08);
      font-family: Arial, sans-serif;
    }
    .btn-nav {
      width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--dourado);
      background: rgba(255,255,255,0.06); color: var(--dourado); font-size: 16px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .btn-nav:hover { background: rgba(255,255,255,0.18); }
    .btn-nav:disabled { opacity: 0.3; cursor: default; }
    .pagina-indicador { font-size: 13px; font-weight: 700; min-width: 110px; text-align: center; }

    .estado {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; text-align: center; padding: 30px;
      font-family: Arial, sans-serif;
    }
    .estado .emoji { font-size: 50px; }
    .estado a {
      margin-top: 10px; padding: 12px 28px; background: var(--roxo); color: #fff;
      border-radius: 50px; text-decoration: none; font-weight: 700; font-size: 13px;
    }

    .aviso-seguranca {
      position: fixed; top: 60px; left: 0; right: 0; text-align: center;
      font-family: Arial, sans-serif; font-size: 10.5px; opacity: 0.35; padding: 4px; z-index: 150;
      pointer-events: none;
    }

    /* Ampliar página — dentro de #livro o pinça-pra-ampliar do navegador não funciona
       (touch-action:none ali é necessário pra biblioteca de virar página reconhecer o
       gesto de arrastar/deslizar sem o navegador competir com zoom). Esta camada usa uma
       imagem simples, sem esse bloqueio, então o pinça nativo do celular funciona nela. */
    .zoom-overlay {
      position: fixed; inset: 0; z-index: 500; display: none;
      background: rgba(0,0,0,0.94);
      overflow: auto; -webkit-overflow-scrolling: touch;
    }
    .zoom-overlay.aberto { display: block; }
    .zoom-overlay img { display: block; width: 100%; height: auto; }
    .zoom-fechar {
      position: fixed; top: 14px; right: 14px; z-index: 510;
      width: 42px; height: 42px; border-radius: 50%;
      background: rgba(0,0,0,0.6); border: 2px solid var(--dourado);
      color: #fff; font-size: 18px; display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }

    @media print {
      body * { display: none !important; }
      body::before { content: "A impressão deste conteúdo não está disponível."; display: block !important; padding: 40px; }
    }

    @media (max-width: 700px) {
      header { padding: 10px 14px; }
      .titulo-livro { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="index.html">BIFFI.ONLINE</a>
    <span class="titulo-livro" id="titulo-livro">Carregando...</span>
    <a class="voltar" href="biblioteca.html"><i class="fa-solid fa-arrow-left"></i> Biblioteca de Oração</a>
  </header>

  <div class="aviso-seguranca">Leitura pessoal e intransferível — cada página é identificada com os dados de quem comprou.</div>

  <div class="palco" id="palco">
    <div class="estado" id="estado">
      <span class="emoji">🐝</span>
      <p>Carregando seu livro...</p>
    </div>
  </div>

  <div class="controles" id="controles" style="display:none;">
    <button class="btn-nav" id="btn-prev"><i class="fa-solid fa-chevron-left"></i></button>
    <span class="pagina-indicador" id="pagina-indicador">Página 1 de 1</span>
    <button class="btn-nav" id="btn-next"><i class="fa-solid fa-chevron-right"></i></button>
    <button class="btn-nav" id="btn-zoom" title="Ampliar página"><i class="fa-solid fa-magnifying-glass-plus"></i></button>
  </div>

  <div class="zoom-overlay" id="zoom-overlay">
    <button class="zoom-fechar" id="zoom-fechar"><i class="fa-solid fa-xmark"></i></button>
    <img id="zoom-img" alt="Página ampliada">
  </div>

  <script src="js/shop-api.js"></script>
  <script src="js/site-track.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const produtoId = params.get('produto');
    const estadoEl = document.getElementById('estado');
    const palco = document.getElementById('palco');
    const controles = document.getElementById('controles');

    function mostrarEstado(emoji, mensagem, linkHtml) {
      controles.style.display = 'none';
      estadoEl.style.display = 'flex';
      estadoEl.innerHTML = `<span class="emoji">${emoji}</span><p>${mensagem}</p>${linkHtml || ''}`;
      if (!palco.contains(estadoEl)) palco.appendChild(estadoEl);
    }

    if (!produtoId) {
      mostrarEstado('🐝', 'Nenhum livro selecionado.', '<a href="loja.html">Ir para a loja</a>');
    } else if (!SHOP_API.token()) {
      const destino = encodeURIComponent(`leitor.html?produto=${produtoId}`);
      mostrarEstado('🔒', 'Você precisa entrar na sua conta para ler este e-book.', `<a href="login.html?redirect=${destino}">Entrar / Criar conta</a>`);
    } else {
      iniciarLeitor();
    }

    async function iniciarLeitor() {
      let info;
      try {
        info = await SHOP_API.call(`/api/livraria/${produtoId}/info`);
      } catch (err) {
        mostrarEstado('🔒', err.message || 'Você ainda não comprou este e-book.', '<a href="loja.html">Ir para a loja</a>');
        return;
      }

      document.getElementById('titulo-livro').textContent = info.titulo;
      document.title = info.titulo + ' — BIFFI.ONLINE';

      const totalPaginas = info.total_paginas;
      const cache = new Map(); // pagina -> blob URL
      const emVoo = new Map(); // pagina -> Promise (evita pedir a mesma página 2x)
      const JANELA = 2; // mantém carregadas: atual ± JANELA

      function urlPagina(n) {
        return `${SHOP_API.base}/api/livraria/${produtoId}/pagina/${n}`;
      }

      async function buscarPagina(n) {
        if (cache.has(n)) return cache.get(n);
        if (emVoo.has(n)) return emVoo.get(n);
        const p = (async () => {
          const res = await fetch(urlPagina(n), { headers: { 'Authorization': 'Bearer ' + SHOP_API.token() } });
          if (!res.ok) throw new Error('Falha ao carregar página ' + n);
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          cache.set(n, url);
          return url;
        })();
        emVoo.set(n, p);
        try { return await p; } finally { emVoo.delete(n); }
      }

      function liberarForaDaJanela(atual) {
        for (const [n, url] of cache) {
          if (Math.abs(n - atual) > JANELA + 1) {
            URL.revokeObjectURL(url);
            cache.delete(n);
          }
        }
      }

      // placeholder leve enquanto a página real não chega
      const PLACEHOLDER = 'data:image/svg+xml;utf8,' + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="500" height="750"><rect width="100%" height="100%" fill="%23F2E6D3"/><text x="50%" y="50%" font-family="Arial" font-size="22" fill="%237A4A2D" text-anchor="middle">🐝</text></svg>'
      );

      // Carrega a primeira página real pra descobrir a proporção certa do livro
      let primeiraUrl;
      try {
        primeiraUrl = await buscarPagina(1);
      } catch (err) {
        mostrarEstado('😕', 'Não foi possível carregar o livro agora. Tente novamente em instantes.');
        return;
      }

      const dimensoes = await new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve({ w: img.naturalWidth || 500, h: img.naturalHeight || 750 });
        img.onerror = () => resolve({ w: 500, h: 750 });
        img.src = primeiraUrl;
      });

      // A biblioteca de leitura (page-flip) vem de um CDN externo — se ela não
      // carregar por qualquer motivo (CDN fora do ar, bloqueio de rede, etc.),
      // ou se qualquer coisa der errado ao montá-la, mostramos um erro claro
      // em vez de deixar a página com os botões/link travados sem explicação.
      if (typeof St === 'undefined' || !St.PageFlip) {
        mostrarEstado('😕', 'Não foi possível carregar o leitor agora (falha ao baixar um recurso do site). Recarregue a página ou tente novamente em instantes.', '<a href="biblioteca.html">Voltar para a Biblioteca</a>');
        console.error('[leitor] biblioteca page-flip (St.PageFlip) não carregou do CDN.');
        return;
      }

      try {
        // Monta a área do leitor
        estadoEl.style.display = 'none';
        const bookEl = document.createElement('div');
        bookEl.id = 'livro';
        palco.innerHTML = '';
        palco.appendChild(bookEl);
        controles.style.display = 'flex';

        const maxW = Math.min(window.innerWidth * 0.92, 1000);
        const maxH = Math.max(window.innerHeight - 140, 300); // nunca deixa ficar negativo/zero em telas muito baixas
        let pageW = dimensoes.w, pageH = dimensoes.h;
        // IMPORTANTE: com usePortrait:true + size:'fixed', a biblioteca page-flip SEMPRE
        // renderiza em modo retrato (1 página por vez, nunca "livro aberto" com 2 páginas
        // lado a lado) — confirmado no código-fonte dela (Render.ts: o container nunca
        // fica largo o bastante pra acionar o modo paisagem/spread, porque UI.ts define a
        // largura mínima do container como setting.width * 1, não * 2, quando usePortrait
        // é true). Por isso o cálculo de escala não deve dividir a largura disponível por
        // 2 (isso fazia a página renderizar SEMPRE com metade do tamanho possível, em
        // qualquer aparelho — no celular, ficava pequena e "sobrando" metade da tela vazia,
        // que era exatamente o bug reportado). Testado localmente (19/08/2026) com a
        // biblioteca real: no celular a página ia de 200px pra 359px de largura (quase
        // dobrou), sem nenhuma mudança perceptível ou regressão no desktop.
        const escala = Math.min(maxW / pageW, maxH / pageH, 1);
        pageW = Math.max(200, Math.round(pageW * escala));
        pageH = Math.max(300, Math.round(pageH * escala));

        const pageFlip = new St.PageFlip(bookEl, {
          width: pageW,
          height: pageH,
          size: 'fixed',
          minWidth: 200,
          maxWidth: 1200,
          minHeight: 300,
          maxHeight: 1600,
          maxShadowOpacity: 0.4,
          showCover: false,
          mobileScrollSupport: false,
          usePortrait: true,
          autoSize: false, // já calculamos o tamanho exato em pixels acima — sem isso a lib estica o livro pra 100% da largura da tela
        });

        const hrefs = new Array(totalPaginas).fill(PLACEHOLDER);
        hrefs[0] = primeiraUrl;
        pageFlip.loadFromImages(hrefs);
        cache.set(1, primeiraUrl);

        function atualizarIndicador() {
          const atual = pageFlip.getCurrentPageIndex() + 1;
          document.getElementById('pagina-indicador').textContent = `Página ${atual} de ${totalPaginas}`;
          document.getElementById('btn-prev').disabled = atual <= 1;
          document.getElementById('btn-next').disabled = atual >= totalPaginas;
        }
        atualizarIndicador();

        // IMPORTANTE: pageFlip.updateFromImages() chama internamente pages.show(),
        // que por sua vez dispara o evento 'flip' (mesmo evento usado abaixo pra
        // detectar quando o LEITOR vira a página). Sem essa trava, cada chamada
        // de updateFromImages() reacionava o handler 'flip', que chamava
        // carregarJanelaAoRedor() de novo, que chamava updateFromImages() de novo
        // — um loop infinito que travava a aba (era a causa do "trava tudo").
        let atualizandoImagens = false;

        async function carregarJanelaAoRedor(pagina1based) {
          const alvo = [];
          for (let d = -JANELA; d <= JANELA; d++) {
            const n = pagina1based + d;
            if (n >= 1 && n <= totalPaginas) alvo.push(n);
          }
          await Promise.all(alvo.map(n => buscarPagina(n).catch(() => null)));

          const novosHrefs = new Array(totalPaginas).fill(PLACEHOLDER);
          for (const [n, url] of cache) novosHrefs[n - 1] = url;
          atualizandoImagens = true;
          pageFlip.updateFromImages(novosHrefs);
          atualizandoImagens = false;
          liberarForaDaJanela(pagina1based);
        }

        carregarJanelaAoRedor(1);

        pageFlip.on('flip', (e) => {
          if (atualizandoImagens) return; // disparado pelo updateFromImages acima, não por um flip real do usuário
          const atual = e.data + 1; // biblioteca usa índice 0-based
          atualizarIndicador();
          carregarJanelaAoRedor(atual);
        });

        document.getElementById('btn-prev').addEventListener('click', () => pageFlip.flipPrev());
        document.getElementById('btn-next').addEventListener('click', () => pageFlip.flipNext());
        document.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowLeft') pageFlip.flipPrev();
          if (e.key === 'ArrowRight') pageFlip.flipNext();
        });

        // Ampliar página (botão 🔍) — abre a página atual, já carregada em cache, numa
        // camada simples por cima de tudo, sem o touch-action:none do #livro, pra dar pra
        // usar o pinça-pra-ampliar nativo do celular pra ler o texto de perto.
        const zoomOverlay = document.getElementById('zoom-overlay');
        const zoomImg = document.getElementById('zoom-img');
        function fecharZoom() { zoomOverlay.classList.remove('aberto'); }
        document.getElementById('btn-zoom').addEventListener('click', async () => {
          const atual = pageFlip.getCurrentPageIndex() + 1;
          try {
            zoomImg.src = await buscarPagina(atual);
            zoomOverlay.classList.add('aberto');
          } catch (err) {
            console.error('[leitor] erro ao ampliar página:', err);
          }
        });
        document.getElementById('zoom-fechar').addEventListener('click', fecharZoom);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') fecharZoom(); });
      } catch (err) {
        console.error('[leitor] erro ao montar o leitor:', err);
        mostrarEstado('😕', 'Algo deu errado ao montar o leitor. Recarregue a página — se o problema continuar, avise a gente.', '<a href="biblioteca.html">Voltar para a Biblioteca</a>');
      }
    }

    /* ── Deterrentes contra cópia fácil (não impedem print de tela) ── */
    document.addEventListener('contextmenu', (e) => e.preventDefault());
    document.addEventListener('selectstart', (e) => e.preventDefault());
    document.addEventListener('dragstart', (e) => e.preventDefault());
    document.addEventListener('keydown', (e) => {
      const bloquear =
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'i', 'j', 'c'].includes(e.key)) ||
        (e.ctrlKey && ['u', 'U', 's', 'S', 'p', 'P'].includes(e.key));
      if (bloquear) e.preventDefault();
    });
  </script>

</body>
</html>
