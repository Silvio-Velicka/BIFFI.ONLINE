<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NectarMine — Desafios</title>
  <link rel="stylesheet" href="css/global.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    /* Banner Central de Missões */
    .missoes-banner {
      position:relative; overflow:hidden;
      background:linear-gradient(135deg, rgba(255,215,0,.08), rgba(123,47,190,.06));
      border:1px solid var(--borda); border-radius:var(--radius-lg);
      padding:20px 24px; margin-bottom:20px;
    }
    .missoes-banner::before {
      content:''; position:absolute; top:0; left:0; right:0; height:3px;
      background:linear-gradient(90deg, var(--amarelo), var(--roxo2), var(--amarelo));
    }
    .missoes-banner h1 { font-size:20px; color:var(--amarelo); display:flex; align-items:center; gap:10px; margin-bottom:6px; }
    .missoes-banner p { font-size:13px; color:var(--texto2); max-width:640px; }

    /* Grid de cards de missão */
    .missoes-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; }
    @media(max-width:800px) { .missoes-grid { grid-template-columns:repeat(2, 1fr); } }
    @media(max-width:500px) { .missoes-grid { grid-template-columns:1fr; } }

    .mcard {
      background:var(--card); backdrop-filter:blur(10px);
      border:1px solid var(--borda2); border-radius:var(--radius);
      padding:16px; display:flex; flex-direction:column; gap:10px;
      transition:border-color .2s;
    }
    .mcard:hover { border-color:var(--borda); }
    .mcard-head { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
    .mcard-head h4 { font-size:14px; color:var(--branco); line-height:1.3; }
    .mcard-icon {
      width:36px; height:36px; border-radius:10px; flex-shrink:0;
      display:flex; align-items:center; justify-content:center; font-size:16px;
      background:var(--amarelo-bg); color:var(--amarelo);
    }
    .mcard-desc { font-size:11.5px; color:var(--texto2); margin-top:-6px; }
    .mcard-tipo {
      align-self:flex-start; font-size:10px; font-weight:bold; padding:3px 10px; border-radius:20px;
      background:rgba(96,165,250,.12); color:var(--azul); border:1px solid rgba(96,165,250,.3);
    }

    .mcard-progress-label { display:flex; justify-content:space-between; font-size:11px; color:var(--texto2); }
    .mcard .progress-bar { height:6px; }

    .mcard-rewards { display:flex; flex-wrap:wrap; gap:6px; }
    .reward-chip { font-size:10.5px; font-weight:bold; padding:4px 10px; border-radius:8px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); white-space:nowrap; }
    .reward-chip.nct    { color:var(--amarelo); }
    .reward-chip.xp     { color:var(--azul); }
    .reward-chip.flores { color:var(--verde); }

    .mcard-btn { width:100%; padding:9px; border-radius:8px; border:none; font-size:12.5px; font-weight:bold; text-align:center; margin-top:auto; }
    .mcard-btn.coletada  { background:rgba(34,197,94,.15); color:var(--verde); cursor:default; }
    .mcard-btn.andamento { background:rgba(255,255,255,.05); color:var(--texto3); cursor:default; }
    .mcard-btn.coletar   { background:var(--verde); color:#fff; cursor:pointer; transition:filter .2s; }
    .mcard-btn.coletar:hover { filter:brightness(1.1); }
  </style>
</head>
<body>

<a href="transicao.html?to=dashboard.html" class="btn-voltar-dashboard"><i class="fa-solid fa-arrow-left"></i> Voltar ao Dashboard</a>

<!-- AD TOPO -->
<div class="ad-topo">
  <iframe src="https://zerads.com/ad/ad.php?width=468&ref=11517" marginwidth="0" marginheight="0" width="468" height="60" scrolling="no" frameborder="0" style="border:0;"></iframe>
  <div class="ad-topo-title">Desafios - NectarMine</div>
</div>

<div class="nm-layout" style="margin-left:0;">
  <main class="page-content" style="padding:10px 20px 30px;">

    <div class="missoes-banner">
      <h1><i class="fa-solid fa-scroll"></i> Central de Missões</h1>
      <p>Complete tarefas diárias e receba recompensas em Néctar, potes e flores (energia). As metas diárias resetam <strong id="reset-info">às 21:00 (horário de Brasília)</strong>.</p>
    </div>

    <div class="missoes-grid" id="missoes-grid">
      <div style="color:var(--texto3);font-size:13px;">Carregando desafios...</div>
    </div>

    <h2 style="font-size:16px;color:var(--branco);margin:26px 0 14px;"><i class="fa-solid fa-user-group" style="color:var(--amarelo)"></i> Metas de Indicação (únicas)</h2>
    <div class="missoes-grid" id="missoes-unicas-grid">
      <div style="color:var(--texto3);font-size:13px;">Carregando...</div>
    </div>

    <!-- Propagandas do rodapé -->
    <div class="rodape-4ads">
      <div>
        <iframe src="https://zerads.com/ad/ad.php?width=728&ref=11517" marginwidth="0" marginheight="0" width="728" height="90" scrolling="no" frameborder="0" style="border:0;"></iframe>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/global.js"></script>
<script src="js/api.js"></script>
<script>
  const ICONES_META = {
    checkin: '🎁', vender_50: '💰', vender_100: '💰', vender_1000: '💰',
  };
  const ICONES_META_UNICA = { indicar_50: '👥', indicar_100: '👥', indicar_500: '👥' };
  const NOMES_APIARIO = { favo1: 'Favo 1 (Iniciante)', favo2: 'Favo 2 (Regular)', favo3: 'Favo 3 (Adeptos)' };

  document.addEventListener('nm:ready', carregarDesafios);

  async function carregarDesafios() {
    const grid = document.getElementById('missoes-grid');
    const gridUnicas = document.getElementById('missoes-unicas-grid');
    try {
      const { metas, metas_unicas, reset_diario } = await NM_API.desafios();
      if (reset_diario) document.getElementById('reset-info').textContent = reset_diario;

      grid.innerHTML = metas.map(m => {
        const pct = Math.min(100, m.progresso / m.target * 100);
        const rewards = `
          <span class="reward-chip nct">Néctar +${nmFormatInt(m.reward_nct)}</span>
          ${m.reward_flores > 0 ? `<span class="reward-chip flores">Flores +${nmFormatInt(m.reward_flores)}</span>` : ''}
          ${m.reward_potes > 0 ? `<span class="reward-chip xp">Potes +${nmFormatInt(m.reward_potes)}</span>` : ''}
        `;
        let btn;
        if (m.resgatada) btn = `<button class="mcard-btn coletada" disabled>Coletada</button>`;
        else if (m.completa) btn = `<button class="mcard-btn coletar" onclick="resgatar('${m.chave}')">Coletar</button>`;
        else btn = `<button class="mcard-btn andamento" disabled>Em andamento</button>`;

        return `
          <div class="mcard">
            <div class="mcard-head">
              <h4>${m.titulo}</h4>
              <div class="mcard-icon">${ICONES_META[m.chave] || '🎯'}</div>
            </div>
            <p class="mcard-desc">${m.descricao}</p>
            <span class="mcard-tipo">Missão diária</span>
            <div>
              <div class="mcard-progress-label"><span>Progresso</span><span>${nmFormatInt(m.progresso)} / ${nmFormatInt(m.target)}</span></div>
              <div class="progress-bar ${m.completa ? 'progress-bar-verde' : ''}"><div class="progress-fill ${m.completa ? 'progress-fill-verde' : ''}" style="width:${pct}%"></div></div>
            </div>
            <div class="mcard-rewards">${rewards}</div>
            ${btn}
          </div>`;
      }).join('');

      gridUnicas.innerHTML = (metas_unicas || []).map(m => {
        const pct = Math.min(100, m.progresso / m.target * 100);
        const rewards = m.apiarios.map(tipo => `<span class="reward-chip xp">${NOMES_APIARIO[tipo] || tipo}</span>`).join('');
        let btn;
        if (m.resgatada) btn = `<button class="mcard-btn coletada" disabled>Coletada</button>`;
        else if (m.completa) btn = `<button class="mcard-btn coletar" onclick="resgatar('${m.chave}')">Coletar</button>`;
        else btn = `<button class="mcard-btn andamento" disabled>Em andamento</button>`;

        return `
          <div class="mcard">
            <div class="mcard-head">
              <h4>${m.titulo}</h4>
              <div class="mcard-icon">${ICONES_META_UNICA[m.chave] || '🎯'}</div>
            </div>
            <p class="mcard-desc">${m.descricao} Os apiários somam aos que você já tem, mesmo além do limite normal de 3.</p>
            <span class="mcard-tipo">Missão única</span>
            <div>
              <div class="mcard-progress-label"><span>Amigos indicados</span><span>${nmFormatInt(m.progresso)} / ${nmFormatInt(m.target)}</span></div>
              <div class="progress-bar ${m.completa ? 'progress-bar-verde' : ''}"><div class="progress-fill ${m.completa ? 'progress-fill-verde' : ''}" style="width:${pct}%"></div></div>
            </div>
            <div class="mcard-rewards">${rewards}</div>
            ${btn}
          </div>`;
      }).join('');
    } catch (e) {
      grid.innerHTML = `<div style="color:var(--texto3);font-size:13px;">Não foi possível carregar os desafios.</div>`;
    }
  }

  async function resgatar(chave) {
    try {
      const r = await NM_API.resgatarDesafio(chave);
      await carregarDesafios();
      if (r.apiarios_ganhos) {
        NM_SWAL.success('Recompensa coletada!', `Você ganhou: ${r.apiarios_ganhos.map(t => NOMES_APIARIO[t] || t).join(', ')}`);
      } else {
        NM_SWAL.success('Recompensa coletada!', `+${nmFormatInt(r.reward_nct)} NCT${r.reward_flores > 0 ? ` · +${nmFormatInt(r.reward_flores)} flores` : ''}${r.reward_potes > 0 ? ` · +${nmFormatInt(r.reward_potes)} potes` : ''}`);
      }
    } catch (e) {
      NM_SWAL.error('Ops!', e.message);
    }
  }
</script>

</body>
</html>
