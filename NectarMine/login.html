<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Redirecionando… — BIFFI.ONLINE</title>
  <!--
    O cadastro/login deixou de ser uma tela própria do jogo — agora existe
    uma única tela (raiz do site: /login.html), usada tanto pelo site
    principal e pela loja quanto pelo jogo. Esta página só existe para não
    quebrar links antigos (favoritos, o link de convite gerado pelo
    servidor, redirecionamentos internos do jogo via nmAuthGuard) —
    ela repassa os parâmetros (redirect/ref) e manda direto para lá.
  -->
  <script>
    const params = new URLSearchParams(location.search);
    const redirectParam = params.get('redirect') || 'dashboard.html';
    const ref = params.get('ref');
    let destino = '../login.html?redirect=' + encodeURIComponent('NectarMine/' + redirectParam);
    if (ref) destino += '&ref=' + encodeURIComponent(ref);
    location.replace(destino);
  </script>
</head>
<body>
</body>
</html>
