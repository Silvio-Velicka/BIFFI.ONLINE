<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finalizar Compra — BIFFI.ONLINE</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --rosa: #F2E6D3; --rosa-med: #D9BC8E; --roxo: #7A4A2D;
      --roxo-esc: #3D2817; --dourado: #C9A227; --branco: #fff;
    }

    body {
      font-family: 'Georgia', serif;
      background: linear-gradient(160deg, #F2E6D3 0%, #EAD7B8 50%, #E3CC9E 100%);
      min-height: 100vh;
      color: var(--roxo-esc);
    }

    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 40px;
      background: rgba(255,255,255,0.35);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(122,74,45,0.15);
    }
    .logo {
      font-size: 22px; font-weight: 900; letter-spacing: 3px; color: var(--roxo);
      text-decoration: none; text-shadow: 1px 1px 0 var(--dourado);
    }
    .voltar-loja {
      font-family: Arial, sans-serif; font-size: 13px; font-weight: 700;
      color: var(--roxo); text-decoration: none;
    }
    .voltar-loja:hover { text-decoration: underline; }

    .page {
      max-width: 900px;
      margin: 0 auto;
      padding: 110px 40px 90px;
    }

    .page-title { text-align: center; margin-bottom: 40px; }
    .page-title .emoji { font-size: 44px; display: block; margin-bottom: 10px; }
    .page-title h1 {
      font-size: 34px; color: var(--roxo); text-shadow: 3px 3px 0 var(--dourado);
      letter-spacing: 2px; margin-bottom: 10px;
    }

    .checkout-grid {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 32px;
      align-items: start;
    }

    .card {
      background: rgba(255,255,255,0.5);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(122,74,45,0.2);
      border-radius: 20px;
      padding: 28px;
      font-family: Arial, sans-serif;
    }

    .card h2 {
      font-family: Georgia, serif;
      font-size: 20px;
      color: var(--roxo);
      margin-bottom: 20px;
      text-shadow: 1px 1px 0 var(--dourado);
    }

    .field { margin-bottom: 16px; }
    .field.half-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field label {
      display: block; font-size: 11px; font-weight: 700; color: var(--roxo);
      text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px;
    }
    .field input {
      width: 100%; padding: 11px 13px; border-radius: 10px;
      border: 2px solid rgba(122,74,45,0.18);
      background: rgba(255,255,255,0.7);
      color: var(--roxo-esc); font-size: 14px; font-family: Arial, sans-serif;
      outline: none; transition: border-color 0.2s;
    }
    .field input:focus { border-color: var(--roxo); }

    .field-row3 { display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 12px; }

    .pagamento-opcoes { display: flex; flex-direction: column; gap: 10px; margin-bottom: 6px; }
    .pagamento-opt {
      display: flex; align-items: center; gap: 10px;
      padding: 13px 14px; border: 2px solid rgba(122,74,45,0.18); border-radius: 12px;
      cursor: pointer; background: rgba(255,255,255,0.4); transition: border-color 0.2s, background 0.2s;
    }
    .pagamento-opt input { accent-color: var(--roxo); }
    .pagamento-opt.selected { border-color: var(--roxo); background: rgba(255,255,255,0.75); }
    .pagamento-opt span.titulo { font-weight: 700; font-size: 13.5px; color: var(--roxo-esc); }
    .pagamento-opt span.desc { display: block; font-size: 11.5px; color: var(--roxo-esc); opacity: 0.75; }
    .pagamento-opt.bloqueado { opacity: 0.55; cursor: not-allowed; background: rgba(255,255,255,0.2); }
    .pagamento-opt.bloqueado input { cursor: not-allowed; }
    .tag-em-breve {
      display: inline-block; margin-left: 6px; padding: 1px 8px; border-radius: 20px;
      background: rgba(122,74,45,0.18); color: var(--roxo-esc); font-size: 9.5px;
      font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; vertical-align: middle;
    }

    .frete-aviso { font-size: 12.5px; opacity: 0.75; padding: 4px 0 6px; }
    .frete-aviso.carregando { opacity: 1; color: var(--roxo); font-weight: 700; }
    .pagamento-opt span.conteudo { flex: 1; }
    .pagamento-opt span.preco { font-weight: 700; font-size: 13.5px; color: var(--roxo); white-space: nowrap; }

    .resumo-itens { margin-bottom: 16px; }
    .resumo-item {
      display: flex; justify-content: space-between; gap: 10px;
      font-size: 13px; padding: 8px 0; border-bottom: 1px solid rgba(122,74,45,0.1);
    }
    .resumo-item .qtd { color: var(--roxo); font-weight: 700; }

    .resumo-linha {
      display: flex; justify-content: space-between; font-size: 13.5px; padding: 6px 0;
    }
    .resumo-linha.total {
      font-size: 17px; font-weight: 900; color: var(--roxo);
      border-top: 2px solid rgba(122,74,45,0.15); margin-top: 8px; padding-top: 12px;
    }

    .btn-finalizar-pedido {
      width: 100%; padding: 15px; margin-top: 18px;
      background: var(--roxo); color: #fff; border: none; border-radius: 50px;
      font-weight: 700; letter-spacing: 1px; font-size: 14.5px; cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    .btn-finalizar-pedido:hover { background: var(--roxo-esc); transform: translateY(-1px); }
    .btn-finalizar-pedido:disabled { opacity: 0.6; cursor: wait; }

    .aviso {
      margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-size: 12.5px;
      display: none; line-height: 1.5;
    }
    .aviso.erro { background: rgba(220,50,50,0.12); color: #8a1f1f; display: block; }
    .aviso.ok { background: rgba(80,180,120,0.15); color: #2e7d4f; display: block; }

    .bloqueio, .vazio {
      text-align: center; font-family: Arial, sans-serif; color: var(--roxo-esc);
      padding: 60px 20px;
    }
    .bloqueio a, .vazio a {
      display: inline-block; margin-top: 18px; padding: 12px 30px;
      background: var(--roxo); color: #fff; border-radius: 50px; text-decoration: none; font-weight: 700;
    }

    .confirmacao {
      text-align: center; font-family: Arial, sans-serif; padding: 40px 20px;
    }
    .confirmacao .emoji-grande { font-size: 56px; display: block; margin-bottom: 16px; }
    .confirmacao h2 { font-family: Georgia, serif; color: var(--roxo); font-size: 26px; margin-bottom: 12px; }
    .confirmacao p { font-size: 14px; line-height: 1.7; margin-bottom: 8px; }
    .confirmacao .btns { margin-top: 24px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .confirmacao .btns a {
      padding: 12px 26px; border-radius: 50px; text-decoration: none; font-weight: 700; font-size: 13px;
    }
    .confirmacao .btns .primario { background: var(--roxo); color: #fff; }
    .confirmacao .btns .secundario { background: transparent; border: 2px solid var(--roxo); color: var(--roxo); }

    @media (max-width: 800px) {
      .checkout-grid { grid-template-columns: 1fr; }
      .page { padding: 90px 20px 60px; }
      header { padding: 12px 16px; }
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="index.html">BIFFI.ONLINE</a>
    <a class="voltar-loja" href="loja.html"><i class="fa-solid fa-arrow-left"></i> Voltar à loja</a>
  </header>

  <div class="page">
    <div class="page-title">
      <span class="emoji">🧾</span>
      <h1>Finalizar Compra</h1>
    </div>

    <div id="checkout-conteudo">
      <p style="text-align:center;font-family:Arial,sans-serif;">Carregando... 🐝</p>
    </div>
  </div>

  <script src="js/site-auth.js"></script>
  <script src="js/site-track.js"></script>
  <script src="js/shop-api.js"></script>
  <script>
    const conteudo = document.getElementById('checkout-conteudo');

    // Opção de frete escolhida pelo cliente (preenchido depois de calcular pelo
    // CEP) — servico_id é só um "palpite" pro servidor; o preço final sempre é
    // recalculado no backend na hora de confirmar o pedido.
    let freteEscolhido = { cents: 0, servico_id: null, calculado: false };

    function atualizarResumoTotal(subtotalCents) {
      const totalEl = document.getElementById('resumo-total');
      if (totalEl) totalEl.textContent = formatarReais(subtotalCents + freteEscolhido.cents);
    }

    // Mesma regra do backend (server.js → ehEnderecoNoBrasil): o Melhor Envio
    // só cota/emite etiqueta pra dentro do Brasil, então qualquer país
    // diferente cai no fluxo manual (frete "a combinar" depois da compra).
    function paisEhBrasil(pais) {
      const p = String(pais ?? '').trim().toLowerCase();
      return p === '' || p === 'brasil' || p === 'brazil' || p === 'br';
    }

    // Mesma tabela do backend (server.js → FRETE_FIXO_INTERNACIONAL) — só pra
    // já mostrar o valor certo na tela sem precisar ir ao servidor. O valor
    // que realmente vale é sempre recalculado no backend na hora de finalizar.
    const FRETE_FIXO_INTERNACIONAL = {
      'estados unidos': 26200, 'eua': 26200, 'usa': 26200,
      'united states': 26200, 'united states of america': 26200, 'estados unidos da america': 26200,
    };
    function normalizarPais(pais) {
      return String(pais ?? '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/\s+/g, ' ');
    }
    function freteFixoInternacional(pais) {
      const chave = normalizarPais(pais);
      return Object.prototype.hasOwnProperty.call(FRETE_FIXO_INTERNACIONAL, chave) ? FRETE_FIXO_INTERNACIONAL[chave] : null;
    }

    async function iniciar() {
      // Exige login de verdade — consulta o servidor (SITE_AUTH.verificar()),
      // não só olha se existe um token guardado no localStorage. Assim, um
      // token expirado/inválido é detectado e limpo automaticamente, em vez
      // de deixar a tela quebrada mais adiante no processo de compra.
      const usuario = await SITE_AUTH.verificar();
      if (!usuario) {
        conteudo.innerHTML = `
          <div class="bloqueio">
            <p>Você precisa entrar na sua conta para finalizar a compra.</p>
            <p style="font-size:12.5px;opacity:.8;">É a mesma conta usada no Game Relax.</p>
            <a href="login.html?redirect=${encodeURIComponent('checkout.html')}">Entrar / Criar conta</a>
          </div>
        `;
        return;
      }

      const itens = CART.itens();
      if (itens.length === 0) {
        conteudo.innerHTML = `
          <div class="vazio">
            <p>Seu carrinho está vazio.</p>
            <a href="loja.html">Ir para a loja</a>
          </div>
        `;
        return;
      }

      let perfil = { perfil: {}, enderecos: [] };
      try { perfil = await SHOP_API.perfil(); } catch (e) { /* segue com campos vazios */ }

      const enderecoPadrao = (perfil.enderecos || [])[0] || {};
      const subtotal = CART.totalCents();
      // E-books não pagam frete (entrega é leitura protegida, sem envio físico).
      // Só entram na conta do frete os itens físicos do carrinho — o valor real
      // (Correios PAC/SEDEX/Mini Envios etc.) é calculado depois, pelo CEP.
      const itensFisicos = itens.filter(i => !i.ebook);

      conteudo.innerHTML = `
        <form id="form-checkout">
          <div class="checkout-grid">
            <div class="card">
              <h2>📦 Endereço de entrega</h2>

              <div class="field">
                <label>País de entrega</label>
                <input type="text" id="f-pais" list="lista-paises" required autocomplete="off" value="${enderecoPadrao.pais || 'Brasil'}">
                <datalist id="lista-paises">
                  <option value="Brasil">
                  <option value="Estados Unidos">
                  <option value="Portugal">
                  <option value="Reino Unido">
                  <option value="Irlanda">
                  <option value="Canadá">
                  <option value="Austrália">
                  <option value="Alemanha">
                  <option value="França">
                  <option value="Espanha">
                  <option value="Itália">
                  <option value="Países Baixos">
                  <option value="Bélgica">
                  <option value="Suíça">
                  <option value="Suécia">
                  <option value="Noruega">
                  <option value="Dinamarca">
                  <option value="Polônia">
                  <option value="México">
                  <option value="Argentina">
                  <option value="Chile">
                  <option value="Uruguai">
                  <option value="Paraguai">
                  <option value="Colômbia">
                  <option value="Peru">
                  <option value="Japão">
                  <option value="Emirados Árabes Unidos">
                  <option value="Nova Zelândia">
                </datalist>
                <p id="pais-aviso-internacional" class="frete-aviso" style="display:none;margin-top:8px;">✈️ Entrega internacional: o frete não é calculado automaticamente — vamos cotar nos Correios e falar com você (WhatsApp/e-mail) com o valor exato antes do envio.</p>
              </div>

              <div class="field">
                <label>Nome do destinatário</label>
                <input type="text" id="f-nome" required value="${enderecoPadrao.nome_destinatario || perfil.perfil.nome_completo || ''}">
              </div>

              <div class="field half-row">
                <div>
                  <label>CPF</label>
                  <input type="text" id="f-cpf" required maxlength="14" placeholder="000.000.000-00" value="${perfil.perfil.cpf || ''}">
                </div>
                <div>
                  <label>Telefone / WhatsApp</label>
                  <input type="text" id="f-telefone" required placeholder="(11) 90000-0000" value="${perfil.perfil.telefone || ''}">
                </div>
              </div>

              <div class="field half-row">
                <div>
                  <label id="label-cep">CEP</label>
                  <input type="text" id="f-cep" required maxlength="12" placeholder="00000-000" value="${enderecoPadrao.cep || ''}">
                </div>
                <div>
                  <label>Rua</label>
                  <input type="text" id="f-rua" required value="${enderecoPadrao.rua || ''}">
                </div>
              </div>

              <div class="field field-row3">
                <div>
                  <label>Número</label>
                  <input type="text" id="f-numero" required value="${enderecoPadrao.numero || ''}">
                </div>
                <div>
                  <label>Complemento</label>
                  <input type="text" id="f-complemento" value="${enderecoPadrao.complemento || ''}">
                </div>
                <div>
                  <label>Bairro</label>
                  <input type="text" id="f-bairro" required value="${enderecoPadrao.bairro || ''}">
                </div>
              </div>

              <div class="field half-row">
                <div>
                  <label>Cidade</label>
                  <input type="text" id="f-cidade" required value="${enderecoPadrao.cidade || ''}">
                </div>
                <div>
                  <label id="label-estado">Estado (UF)</label>
                  <input type="text" id="f-estado" required maxlength="40" value="${enderecoPadrao.estado || ''}">
                </div>
              </div>

              ${itensFisicos.length > 0 ? `
              <h2 style="margin-top:8px;">🚚 Frete</h2>
              <div id="frete-aviso" class="frete-aviso">Preencha o CEP acima para calcular o frete.</div>
              <div id="frete-opcoes" class="pagamento-opcoes" style="display:none;"></div>
              ` : ''}

              <h2 style="margin-top:8px;">💳 Forma de pagamento</h2>
              <div class="pagamento-opcoes">
                <label class="pagamento-opt selected">
                  <input type="radio" name="pagamento" value="mercadopago" checked>
                  <span>
                    <span class="titulo">Mercado Pago</span>
                    <span class="desc">PIX, cartão ou boleto.</span>
                  </span>
                </label>
                <label class="pagamento-opt bloqueado">
                  <input type="radio" name="pagamento" value="paypal" disabled>
                  <span>
                    <span class="titulo">PayPal <span class="tag-em-breve">Em breve</span></span>
                    <span class="desc">Cartão internacional via PayPal. (Ainda não disponível.)</span>
                  </span>
                </label>
              </div>
            </div>

            <div class="card">
              <h2>🧾 Resumo do pedido</h2>
              <div class="resumo-itens">
                ${itens.map(i => `
                  <div class="resumo-item">
                    <span><span class="qtd">${i.quantidade}x</span> ${i.nome}</span>
                    <span>${formatarReais(i.preco_cents * i.quantidade)}</span>
                  </div>
                `).join('')}
              </div>
              <div class="resumo-linha"><span>Subtotal</span><span>${formatarReais(subtotal)}</span></div>
              <div class="resumo-linha"><span>Frete</span><span id="resumo-frete">${itensFisicos.length === 0 ? 'Grátis' : 'Informe o CEP'}</span></div>
              <div class="resumo-linha total"><span>Total</span><span id="resumo-total">${formatarReais(subtotal)}</span></div>

              <button type="submit" class="btn-finalizar-pedido" id="btn-finalizar-pedido">Confirmar pedido</button>
              <div class="aviso" id="checkout-aviso"></div>
            </div>
          </div>
        </form>
      `;

      // Realça visualmente a opção de pagamento escolhida
      document.querySelectorAll('.pagamento-opt input').forEach(r => {
        r.addEventListener('change', () => {
          document.querySelectorAll('.pagamento-opt').forEach(o => o.classList.remove('selected'));
          r.closest('.pagamento-opt').classList.add('selected');
        });
      });

      // Ajusta os campos de CEP/Estado e o comportamento do frete conforme o
      // país escolhido: dentro do Brasil, mantém CEP/UF no formato brasileiro
      // e cálculo automático de frete; fora do Brasil, libera os campos (sem
      // formato fixo) e mostra o aviso de frete manual, sem tentar calcular.
      function atualizarCamposPorPais() {
        const pais = document.getElementById('f-pais').value;
        const brasil = paisEhBrasil(pais);
        const campoEstado = document.getElementById('f-estado');
        const avisoInternacional = document.getElementById('pais-aviso-internacional');

        document.getElementById('label-cep').textContent = brasil ? 'CEP' : 'CEP / Código postal';
        document.getElementById('f-cep').placeholder = brasil ? '00000-000' : 'Código postal do país';
        document.getElementById('label-estado').textContent = brasil ? 'Estado (UF)' : 'Estado / Província / Região';
        campoEstado.style.textTransform = brasil ? 'uppercase' : 'none';
        if (avisoInternacional) avisoInternacional.style.display = brasil ? 'none' : 'block';

        if (itensFisicos.length > 0) {
          if (brasil) {
            const cep = document.getElementById('f-cep').value.replace(/\D/g, '');
            if (cep.length === 8) { calcularFreteUI(cep, itensFisicos, subtotal); }
            else {
              freteEscolhido = { cents: 0, servico_id: null, calculado: false };
              const freteResumoEl = document.getElementById('resumo-frete');
              if (freteResumoEl) freteResumoEl.textContent = 'Informe o CEP';
              const avisoEl = document.getElementById('frete-aviso');
              const opcoesEl = document.getElementById('frete-opcoes');
              if (avisoEl) { avisoEl.textContent = 'Preencha o CEP acima para calcular o frete.'; avisoEl.style.display = 'block'; avisoEl.classList.remove('carregando'); }
              if (opcoesEl) { opcoesEl.style.display = 'none'; opcoesEl.innerHTML = ''; }
              atualizarResumoTotal(subtotal);
            }
          } else {
            const avisoEl = document.getElementById('frete-aviso');
            const opcoesEl = document.getElementById('frete-opcoes');
            const freteResumoEl = document.getElementById('resumo-frete');
            const freteFixo = freteFixoInternacional(pais);

            if (freteFixo != null) {
              // País com frete fixo já definido (ex.: Estados Unidos) — soma direto no total.
              freteEscolhido = { cents: freteFixo, servico_id: null, calculado: true, internacional: true };
              if (avisoEl) { avisoEl.textContent = `📦 Frete fixo internacional (Correios): ${formatarReais(freteFixo)} — já incluído no total.`; avisoEl.style.display = 'block'; avisoEl.classList.remove('carregando'); }
              if (opcoesEl) { opcoesEl.style.display = 'none'; opcoesEl.innerHTML = ''; }
              if (freteResumoEl) freteResumoEl.textContent = formatarReais(freteFixo);
            } else {
              // Sem frete fixo cadastrado pra esse país: fica "a combinar", sem entrar no total agora.
              freteEscolhido = { cents: 0, servico_id: null, calculado: true, internacional: true };
              if (avisoEl) { avisoEl.textContent = '✈️ Frete internacional a combinar — não entra no total agora.'; avisoEl.style.display = 'block'; avisoEl.classList.remove('carregando'); }
              if (opcoesEl) { opcoesEl.style.display = 'none'; opcoesEl.innerHTML = ''; }
              if (freteResumoEl) freteResumoEl.textContent = 'A combinar';
            }
            atualizarResumoTotal(subtotal);
          }
        }
      }

      document.getElementById('f-pais').addEventListener('input', atualizarCamposPorPais);
      document.getElementById('f-pais').addEventListener('change', atualizarCamposPorPais);

      // Busca automática de endereço pelo CEP (ViaCEP — API pública, sem chave;
      // só faz sentido pra CEP brasileiro, então só tenta se o país for Brasil)
      document.getElementById('f-cep').addEventListener('blur', async (e) => {
        if (!paisEhBrasil(document.getElementById('f-pais').value)) return;
        const cep = e.target.value.replace(/\D/g, '');
        if (cep.length !== 8) return;
        try {
          const resp = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
          const data = await resp.json();
          if (!data.erro) {
            document.getElementById('f-rua').value = data.logradouro || document.getElementById('f-rua').value;
            document.getElementById('f-bairro').value = data.bairro || document.getElementById('f-bairro').value;
            document.getElementById('f-cidade').value = data.localidade || document.getElementById('f-cidade').value;
            document.getElementById('f-estado').value = data.uf || document.getElementById('f-estado').value;
          }
        } catch (e) { /* silencioso — usuário preenche manualmente */ }
        if (itensFisicos.length > 0) calcularFreteUI(cep, itensFisicos, subtotal);
      });

      // Estado inicial dos campos (aplica o país já pré-preenchido — Brasil por padrão)
      atualizarCamposPorPais();

      // Se já tem CEP salvo do perfil (e o país é Brasil), calcula o frete assim que a tela abre
      if (itensFisicos.length > 0 && enderecoPadrao.cep && paisEhBrasil(document.getElementById('f-pais').value)) {
        calcularFreteUI(enderecoPadrao.cep.replace(/\D/g, ''), itensFisicos, subtotal);
      }

      document.getElementById('form-checkout').addEventListener('submit', finalizarPedido);
    }

    // Calcula as opções de frete reais (Correios PAC/SEDEX/Mini Envios etc.) pra
    // um CEP e mostra como cards selecionáveis, igual à forma de pagamento.
    async function calcularFreteUI(cep, itensFisicos, subtotalCents) {
      const avisoEl = document.getElementById('frete-aviso');
      const opcoesEl = document.getElementById('frete-opcoes');
      if (!avisoEl || !opcoesEl) return;
      if (cep.length !== 8) return;

      avisoEl.textContent = '⏳ Calculando frete...';
      avisoEl.classList.add('carregando');
      avisoEl.style.display = 'block';
      opcoesEl.style.display = 'none';
      opcoesEl.innerHTML = '';
      freteEscolhido = { cents: 0, servico_id: null, calculado: false };
      atualizarResumoTotal(subtotalCents);

      try {
        const itensPayload = itensFisicos.map(i => ({ produto_id: i.produto_id, quantidade: i.quantidade }));
        const resultado = await SHOP_API.calcularFrete(cep, itensPayload);
        const opcoes = resultado.opcoes || [];
        if (opcoes.length === 0) throw new Error('Nenhuma opção de frete disponível.');

        avisoEl.style.display = 'none';
        avisoEl.classList.remove('carregando');
        opcoesEl.style.display = 'flex';
        opcoesEl.innerHTML = opcoes.map((op, i) => {
          const titulo = op.empresa ? `${op.empresa} — ${op.nome}` : op.nome;
          const prazo = op.prazo_dias ? `${op.prazo_dias} ${op.prazo_dias === 1 ? 'dia útil' : 'dias úteis'}` : '';
          return `
            <label class="pagamento-opt ${i === 0 ? 'selected' : ''}">
              <input type="radio" name="frete_opcao" value="${op.id ?? ''}" data-cents="${op.preco_cents}" ${i === 0 ? 'checked' : ''}>
              <span class="conteudo">
                <span class="titulo">${titulo}</span>
                ${prazo ? `<span class="desc">${prazo}</span>` : ''}
              </span>
              <span class="preco">${op.preco_cents === 0 ? 'Grátis' : formatarReais(op.preco_cents)}</span>
            </label>
          `;
        }).join('');

        document.querySelectorAll('#frete-opcoes input[name="frete_opcao"]').forEach(r => {
          r.addEventListener('change', () => {
            document.querySelectorAll('#frete-opcoes .pagamento-opt').forEach(o => o.classList.remove('selected'));
            r.closest('.pagamento-opt').classList.add('selected');
            freteEscolhido = { cents: Number(r.dataset.cents) || 0, servico_id: r.value ? Number(r.value) : null, calculado: true };
            atualizarResumoTotal(subtotalCents);
          });
        });

        const primeiro = opcoes[0];
        freteEscolhido = { cents: primeiro.preco_cents, servico_id: primeiro.id ?? null, calculado: true };
        atualizarResumoTotal(subtotalCents);

        const freteResumoEl = document.getElementById('resumo-frete');
        if (freteResumoEl) freteResumoEl.textContent = 'Ver opções acima';
        if (resultado.aviso) { avisoEl.textContent = resultado.aviso; avisoEl.style.display = 'block'; }
      } catch (err) {
        avisoEl.classList.remove('carregando');
        avisoEl.style.display = 'block';
        avisoEl.textContent = 'Não foi possível calcular o frete agora. Tente novamente ou prossiga — vamos confirmar o valor por e-mail/WhatsApp.';
      }
    }

    async function finalizarPedido(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-finalizar-pedido');
      const aviso = document.getElementById('checkout-aviso');
      aviso.className = 'aviso';
      aviso.style.display = 'none';
      btn.disabled = true;
      btn.textContent = 'Processando...';

      const paisEscolhido = document.getElementById('f-pais').value.trim() || 'Brasil';
      const brasil = paisEhBrasil(paisEscolhido);

      const payload = {
        itens: CART.itens().map(i => ({ produto_id: i.produto_id, quantidade: i.quantidade })),
        endereco: {
          pais: paisEscolhido,
          nome_destinatario: document.getElementById('f-nome').value.trim(),
          cpf: document.getElementById('f-cpf').value.trim(),
          telefone: document.getElementById('f-telefone').value.trim(),
          cep: document.getElementById('f-cep').value.trim(),
          rua: document.getElementById('f-rua').value.trim(),
          numero: document.getElementById('f-numero').value.trim(),
          complemento: document.getElementById('f-complemento').value.trim(),
          bairro: document.getElementById('f-bairro').value.trim(),
          cidade: document.getElementById('f-cidade').value.trim(),
          // Só força maiúsculas na sigla de UF brasileira — estado/província
          // estrangeiro mantém a capitalização que a pessoa digitou.
          estado: brasil ? document.getElementById('f-estado').value.trim().toUpperCase() : document.getElementById('f-estado').value.trim(),
        },
        metodo_pagamento: document.querySelector('input[name="pagamento"]:checked').value,
        frete_servico_id: freteEscolhido.servico_id,
      };

      try {
        const resultado = await SHOP_API.checkout(payload);
        CART.limpar();

        if (resultado.pagamento_url) {
          conteudo.innerHTML = `<p style="text-align:center;font-family:Arial,sans-serif;">Redirecionando para o pagamento... 🐝</p>`;
          location.href = resultado.pagamento_url;
          return;
        }

        conteudo.innerHTML = `
          <div class="card confirmacao">
            <span class="emoji-grande">🐝💌</span>
            <h2>Pedido #${resultado.pedido_id} registrado!</h2>
            <p>${resultado.aviso || 'Em breve entraremos em contato para combinar os próximos passos.'}</p>
            <p style="font-weight:700;">${resultado.frete_pendente ? 'Total (sem o frete, que será combinado à parte):' : 'Total:'} ${formatarReais(resultado.total_cents)}</p>
            <div class="btns">
              <a class="primario" href="meus-pedidos.html">Ver meus pedidos</a>
              <a class="secundario" href="loja.html">Voltar à loja</a>
            </div>
          </div>
        `;
      } catch (err) {
        aviso.textContent = err.message || 'Não foi possível finalizar o pedido. Tente novamente em instantes.';
        aviso.classList.add('erro');
        btn.disabled = false;
        btn.textContent = 'Confirmar pedido';
      }
    }

    iniciar();
  </script>
